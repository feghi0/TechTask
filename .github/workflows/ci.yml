name: TechTask verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: techtask_test
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: techtask_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U techtask_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://techtask_test:ci_disposable_password@127.0.0.1:5432/techtask_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/evidencias/*.png
            test-results/
          if-no-files-found: ignore
